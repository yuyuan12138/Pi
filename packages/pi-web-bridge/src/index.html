<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Mission Control</title>
<style>
  /* ---------- tokens ---------- */
  :root {
    --bg: #0a0a0b;
    --panel: #0e0e10;
    --raised: #15151a;
    --raised-2: #1b1b21;
    --bubble: #17171d;
    --input-bg: #121216;
    --border: #2a2a32;
    --border-soft: #1c1c22;
    --text: #ededf0;
    --body-2: #d9d9e0;
    --muted: #a4a4ae;
    --dim: #8d8d97;
    --green: #4dd694;
    --red: #ff7a72;
    --dot-idle: #3c3c45;
    --btn-bg: #f2f2f3;
    --btn-fg: #0a0a0b;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --tb-h: 48px;
    --lb-h: 40px;
    --panel-w: 320px;
    --measure: 720px;
    --ease: cubic-bezier(.2, .7, .2, 1);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; flex-direction: column; overflow: hidden;
    background: var(--bg); color: var(--text);
    font: 14px/1.6 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: var(--mono); }
  ::selection { background: #2c2c36; }
  :focus-visible { outline: 1px solid #4a4a56; outline-offset: 2px; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #232329; border-radius: 5px; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-track { background: transparent; }
  * { scrollbar-width: thin; scrollbar-color: #232329 transparent; }

  /* ---------- status dots ---------- */
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--dot-idle); }
  .dot.running { background: var(--green); animation: pulse 2.4s ease-in-out infinite; }
  .dot.blocked { background: var(--red); }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }

  .st.blocked { color: var(--red); }
  .badge {
    flex: none; min-width: 18px; padding: 0 5px; border-radius: 4px; text-align: center;
    background: var(--raised-2); border: 1px solid #3a3a44; color: var(--text);
    font-family: var(--mono); font-size: 10.5px; line-height: 16px;
  }

  /* ---------- top bar ---------- */
  #topbar {
    height: var(--tb-h); flex: none; display: flex; align-items: center; gap: 12px;
    padding: 0 16px; border-bottom: 1px solid var(--border-soft); position: relative; z-index: 60;
  }
  .wordmark { font-size: 11px; font-weight: 650; letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; }
  #project { font-size: 11px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 180px; }
  .flex-spacer { flex: 1; }
  .bridge { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--dim); white-space: nowrap; }

  /* ---------- mobile live bar ---------- */
  #livebar { display: none; }

  /* ---------- shell ---------- */
  #shell { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) var(--panel-w); }

  /* ---------- hero conversation ---------- */
  #hero { min-width: 0; display: flex; flex-direction: column; position: relative; }
  #head {
    flex: none; display: flex; align-items: baseline; gap: 12px;
    padding: 12px 24px; border-bottom: 1px solid var(--border-soft);
  }
  #head h2 { margin: 0; font-size: 13px; font-weight: 600; }
  #win-meta { margin-left: auto; font-size: 11px; color: var(--dim); font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #log { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
  .col { max-width: var(--measure); margin: 0 auto; padding: 28px 24px 16px; display: flex; flex-direction: column; gap: 20px; }

  .msg { max-width: min(78%, 560px); }
  .msg.user { align-self: flex-end; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .msg.user .bubble {
    background: var(--bubble); border: 1px solid var(--border); border-radius: 14px;
    padding: 10px 14px; white-space: pre-wrap; overflow-wrap: break-word;
  }
  .msg.user.pending .bubble { opacity: .55; }
  .msg.user.failed .bubble { border-color: var(--red); }
  .msg.user.failed .meta { color: var(--red); }
  .msg.assistant { align-self: flex-start; max-width: 100%; }
  .meta { font-size: 11px; color: var(--dim); }
  .msg.assistant .meta { text-transform: uppercase; letter-spacing: .08em; font-size: 10.5px; margin-bottom: 4px; }
  .atext { white-space: pre-wrap; overflow-wrap: break-word; }

  .evt { border-left: 2px solid var(--border); padding: 2px 0 2px 12px; overflow-wrap: break-word; font-size: 13px; color: var(--body-2); }
  .evt.tool { display: flex; gap: 8px; min-width: 0; border-left-color: var(--border-soft); font-family: var(--mono); font-size: 12px; color: var(--dim); }
  .evt.tool .tname { color: var(--muted); flex: none; }
  .evt.tool .targs { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .evt.report .rstatus, .evt.task .rstatus {
    font-family: var(--mono); font-size: 10.5px; text-transform: uppercase;
    letter-spacing: .08em; color: var(--muted); margin-right: 8px;
  }
  .evt.report[data-status="ready"] { border-left-color: var(--green); }
  .evt.report[data-status="ready"] .rstatus { color: var(--green); }
  .evt.report[data-status="blocked"] { border-left-color: var(--red); }
  .evt.report[data-status="blocked"] .rstatus { color: var(--red); }
  .evt.task { color: var(--muted); }
  .evt.settled { border-left: 0; padding-left: 0; text-align: center; font-family: var(--mono); font-size: 11px; color: var(--dim); }

  .result-block { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
  .rb-label { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); margin-bottom: 8px; }
  .result-block pre { margin: 0; font-family: var(--mono); font-size: 12px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: break-word; }
  .sysline { align-self: center; font-size: 11.5px; color: var(--dim); text-align: center; }
  .empty { align-self: center; color: var(--dim); text-align: center; padding: 56px 0; font-size: 13px; }

  #jump, #sjump {
    position: absolute; right: 24px; bottom: 96px; z-index: 5;
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px;
    background: var(--raised-2); color: var(--muted); font: 12px var(--sans); cursor: pointer;
  }
  #jump:hover, #sjump:hover { color: var(--text); border-color: #3d3d47; }

  /* ---------- composers ---------- */
  #composer, #scomposer { flex: none; border-top: 1px solid var(--border-soft); padding: 12px 24px 16px; background: var(--bg); }
  .comp-inner { max-width: var(--measure); margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1; min-width: 0; resize: none; background: var(--input-bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
    font: 14px/1.5 var(--sans); max-height: 160px; outline: none;
  }
  textarea:focus { border-color: #3d3d47; }
  textarea::placeholder { color: var(--dim); }
  .send {
    flex: none; height: 43px; padding: 0 16px; border: 0; border-radius: 9px;
    background: var(--btn-bg); color: var(--btn-fg); font: 600 13px var(--sans); cursor: pointer;
  }
  .send:disabled { background: #1d1d23; color: #6e6e79; cursor: default; }

  /* ---------- live work panel ---------- */
  #panel {
    min-height: 0; display: flex; flex-direction: column;
    background: var(--panel); border-left: 1px solid var(--border-soft);
  }
  .panel-head {
    flex: none; display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px 10px;
  }
  .label { font-size: 10.5px; font-weight: 650; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  #panel-count { font-family: var(--mono); font-size: 11px; color: var(--dim); }
  #panel-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 0 8px 12px; }
  .card {
    display: grid; width: 100%; text-align: left; margin: 2px 0; padding: 10px;
    grid-template-columns: auto minmax(0, 1fr) auto auto;
    grid-template-areas: "dot name badge time" "sub sub sub sub" "tick tick tick tick";
    align-items: center; column-gap: 8px; row-gap: 2px;
    background: transparent; border: 1px solid transparent; border-radius: 8px;
    color: var(--text); font: inherit; cursor: pointer;
  }
  .card:hover { background: var(--raised); }
  .card.active { background: var(--raised-2); border-color: var(--border); }
  .card .dot { grid-area: dot; }
  .card-name { grid-area: name; min-width: 0; font-family: var(--mono); font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-badge { grid-area: badge; }
  .card-time { grid-area: time; font-family: var(--mono); font-size: 10.5px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .card-sub { grid-area: sub; min-width: 0; font-family: var(--mono); font-size: 10.5px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-ticker { grid-area: tick; min-width: 0; font-family: var(--mono); font-size: 10.5px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .linklike {
    display: block; width: calc(100% - 4px); margin: 8px 2px 2px; padding: 6px 8px;
    background: none; border: 0; border-radius: 6px; color: var(--dim);
    font: 12px var(--sans); cursor: pointer; text-align: left;
  }
  .linklike:hover { color: var(--muted); background: var(--raised); }
  .panel-empty { padding: 20px 10px; color: var(--dim); font-size: 12px; }

  /* ---------- usage (resource inventory) ---------- */
  .usage { flex: none; border-bottom: 1px solid var(--border-soft); }
  #main-usage { background: var(--bg); }
  #so-usage { background: var(--panel); }
  .usage-head {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 8px 24px; background: none; border: 0; cursor: pointer;
    font: inherit; text-align: left; color: inherit;
  }
  #so-usage .usage-head { padding: 8px 16px; }
  .usage-head:hover .usage-title { color: var(--text); }
  .usage-title { flex: none; font-size: 10.5px; font-weight: 650; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .usage-sum { flex: 1; min-width: 0; font-family: var(--mono); font-size: 10.5px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right; }
  .usage-head .chev { flex: none; color: var(--dim); transition: transform .2s var(--ease); }
  .usage-head[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .usage-body { max-height: 264px; overflow-y: auto; padding: 2px 24px 12px; }
  #so-usage .usage-body { padding: 2px 16px 12px; }
  .u-sec { margin-bottom: 12px; }
  .u-sec:last-child { margin-bottom: 2px; }
  .u-label { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); margin-bottom: 4px; }
  .u-row {
    display: grid; grid-template-columns: minmax(0, 1fr) 72px 56px; align-items: center; gap: 10px;
    padding: 3px 0; border-bottom: 1px solid var(--border-soft); font-family: var(--mono); font-size: 11px;
  }
  .u-row:last-child { border-bottom: 0; }
  .u-name { color: var(--body-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .u-bar { height: 3px; background: var(--raised-2); border-radius: 2px; position: relative; overflow: hidden; }
  .u-bar i { position: absolute; top: 0; bottom: 0; left: 0; background: #3a3a44; border-radius: 2px; }
  .u-count { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  .u-more { font-family: var(--mono); font-size: 10.5px; color: var(--dim); padding: 5px 0 0; }
  .u-line { font-family: var(--mono); font-size: 11px; color: var(--dim); padding: 2px 0; overflow-wrap: break-word; }
  .u-line b { color: var(--body-2); font-weight: 600; }
  .u-empty { font-size: 12px; color: var(--dim); padding: 2px 0 4px; }
  .u-sub-row { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 3px 0; border-bottom: 1px solid var(--border-soft); font-size: 11px; }
  .u-sub-row:last-child { border-bottom: 0; }
  .u-sub-id { font-family: var(--mono); color: var(--body-2); flex: none; max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .u-sub-label { color: var(--dim); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .u-sub-status { font-family: var(--mono); font-size: 10px; color: var(--dim); flex: none; }
  .u-sub-status.blocked { color: var(--red); }

  /* ---------- slide-over transcript ---------- */
  #backdrop {
    position: fixed; inset: var(--tb-h) 0 0 0; background: rgba(0, 0, 0, .55); z-index: 45;
    opacity: 0; visibility: hidden; transition: opacity .2s ease, visibility 0s linear .2s;
  }
  #backdrop.on { opacity: 1; visibility: visible; transition: opacity .2s ease; }
  #slideover {
    position: fixed; top: var(--tb-h); right: 0; bottom: 0; width: min(480px, 100%);
    display: flex; flex-direction: column; z-index: 50;
    background: var(--panel); border-left: 1px solid var(--border-soft);
    box-shadow: -24px 0 48px rgba(0, 0, 0, .45);
    transform: translateX(103%); visibility: hidden;
    transition: transform .24s var(--ease), visibility 0s linear .24s;
  }
  #slideover.open { transform: none; visibility: visible; transition: transform .24s var(--ease); }
  .so-head {
    flex: none; display: grid; align-items: center; column-gap: 10px; row-gap: 4px;
    grid-template-columns: auto minmax(0, 1fr) auto auto;
    padding: 14px 16px 12px; border-bottom: 1px solid var(--border-soft);
  }
  .so-title { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  #so-id { font-family: var(--mono); font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #so-sub { font-family: var(--mono); font-size: 10.5px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #so-time { font-family: var(--mono); font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .iconbtn {
    width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center;
    background: transparent; border: 1px solid transparent; border-radius: 6px; color: var(--dim); cursor: pointer;
  }
  .iconbtn:hover { color: var(--text); background: var(--raised); border-color: var(--border); }
  #so-label {
    grid-column: 1 / -1; margin: 0; font-size: 12px; line-height: 1.5; color: var(--muted);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  #slog { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
  .so-col { padding: 16px 16px 12px; gap: 16px; }
  #sjump { right: 16px; bottom: 88px; }
  #scomposer { padding: 12px 16px 16px; }
  #scomposer .comp-inner { max-width: none; }

  /* ---------- breakpoints ---------- */
  @media (max-width: 1079px) {
    :root { --panel-w: 280px; }
  }
  @media (max-width: 719px) {
    #shell { grid-template-columns: minmax(0, 1fr); }
    #livebar {
      display: flex; align-items: center; gap: 10px; flex: none; height: var(--lb-h); width: 100%;
      padding: 0 16px; background: var(--bg); border: 0; border-bottom: 1px solid var(--border-soft);
      color: var(--muted); font: 11px var(--mono); cursor: pointer; text-align: left;
    }
    .lb-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    #livebar svg { transition: transform .2s var(--ease); }
    #livebar.open svg { transform: rotate(90deg); }
    #panel {
      position: fixed; top: calc(var(--tb-h) + var(--lb-h)); left: 0; right: 0; bottom: 0; z-index: 40;
      border-left: 0; box-shadow: none;
      transform: translateX(103%); visibility: hidden;
      transition: transform .24s var(--ease), visibility 0s linear .24s;
    }
    #panel.open { transform: none; visibility: visible; transition: transform .24s var(--ease); }
    .col { padding: 20px 16px 12px; }
    #composer { padding: 10px 12px 12px; }
    #jump { right: 16px; }
    #topbar #project { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<header id="topbar">
  <span class="wordmark">Mission Control</span>
  <span id="project" class="mono">&mdash;</span>
  <span class="flex-spacer"></span>
  <span class="bridge"><span class="dot" id="bridge-dot"></span><span id="bridge-status" class="mono">connecting</span></span>
</header>

<button id="livebar" type="button" aria-expanded="false" aria-controls="panel">
  <span class="dot" id="livebar-dot"></span>
  <span id="livebar-text">no live work</span>
  <span class="lb-right">
    <span class="badge" id="livebar-badge" hidden></span>
    <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M4 2l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </span>
</button>

<div id="shell">
  <main id="hero">
    <header id="head">
      <h2>Coordinator</h2>
      <span id="win-meta"></span>
    </header>
    <section class="usage" id="main-usage">
      <button class="usage-head" id="main-usage-head" type="button" aria-expanded="false" aria-controls="main-usage-body">
        <span class="usage-title">Usage</span>
        <span class="usage-sum" id="main-usage-sum">no activity yet</span>
        <svg class="chev" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M4 2l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="usage-body" id="main-usage-body" hidden></div>
    </section>
    <div id="log"><div class="col" id="logcol"></div></div>
    <button id="jump" type="button" hidden>Jump to latest</button>
    <form id="composer">
      <div class="comp-inner">
        <textarea id="input" rows="1" placeholder="Message the coordinator"></textarea>
        <button id="send" class="send" type="submit" disabled>Send</button>
      </div>
    </form>
  </main>

  <aside id="panel" aria-label="Live subagent work">
    <div class="panel-head">
      <span class="label">Live work</span>
      <span id="panel-count"></span>
    </div>
    <div id="panel-scroll">
      <div id="cards"></div>
      <button id="done-toggle" class="linklike" type="button" hidden></button>
      <div id="done-cards" hidden></div>
      <div id="panel-empty" class="panel-empty" hidden>No subagents yet &mdash; spawned agents appear here.</div>
    </div>
  </aside>
</div>

<div id="backdrop"></div>

<section id="slideover" aria-label="Subagent transcript">
  <header class="so-head">
    <span class="dot" id="so-dot"></span>
    <div class="so-title">
      <span id="so-id"></span>
      <span id="so-sub"></span>
    </div>
    <span id="so-time"></span>
    <button id="so-close" class="iconbtn" type="button" aria-label="Close transcript">
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2l10 10M12 2L2 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
    <p id="so-label"></p>
  </header>
  <section class="usage" id="so-usage">
    <button class="usage-head" id="so-usage-head" type="button" aria-expanded="true" aria-controls="so-usage-body">
      <span class="usage-title">Usage</span>
      <span class="usage-sum" id="so-usage-sum">no activity yet</span>
      <svg class="chev" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M4 2l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="usage-body" id="so-usage-body"></div>
  </section>
  <div id="slog"><div class="col so-col" id="slogcol"></div></div>
  <button id="sjump" type="button" hidden>Jump to latest</button>
  <form id="scomposer">
    <div class="comp-inner">
      <textarea id="sinput" rows="1" placeholder="Reply"></textarea>
      <button id="ssend" class="send" type="submit" disabled>Send</button>
    </div>
  </form>
</section>

<script>
"use strict";
(() => {
  const $ = (s) => document.querySelector(s);

  // ---------- state ----------
  const state = {
    subs: new Map(),          // id -> SubagentView (latest /state)
    openSub: null,            // slide-over target id | null
    panelOpen: false,         // mobile drawer
    wins: new Map(),          // id -> { items, cursor, resultText, done, stats }
    unread: new Map(),        // id -> new-line count since last open
    prevActivity: new Map(),  // id -> lastActivity (fallback unread path)
    firstSeen: new Map(),     // id -> epoch ms first observed (elapsed base)
    doneShown: false,
    bridgeDown: false,
    usageOpen: new Map(),     // "main" | sub id -> collapsed/expanded (default: main collapsed, subs expanded)
  };
  const logOkAt = new Map();  // id -> epoch ms of last successful sub-log poll
  const cardEls = new Map();  // id -> card element record

  const win = (id) => {
    let w = state.wins.get(id);
    if (!w) { w = { items: [], cursor: null, resultText: null, done: false, stats: null }; state.wins.set(id, w); }
    return w;
  };

  // ---------- helpers ----------
  async function api(path, opts) {
    // Relative on purpose: when served under a sub-path (e.g. /pi-bridge/), a
    // leading slash would resolve against the domain root and hit other apps.
    const r = await fetch(path.replace(/^\/+/, ""), opts);
    let body = null;
    try { body = await r.json(); } catch { /* empty body */ }
    return { ok: r.ok, code: r.status, body };
  }
  function relTime(ts) {
    if (!ts) return "";
    const s = Math.max(0, (Date.now() - ts) / 1000);
    if (s < 60) return "just now";
    if (s < 3600) return `${Math.floor(s / 60)}m ago`;
    if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
    return `${Math.floor(s / 86400)}d ago`;
  }
  function fmtTokens(n) {
    if (!Number.isFinite(n) || n <= 0) return "0";
    if (n >= 1e9) return (n / 1e9).toFixed(n >= 1e10 ? 0 : 1) + "G";
    if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + "M";
    if (n >= 1e3) return (n / 1e3).toFixed(n >= 1e5 ? 0 : 1) + "k";
    return String(Math.round(n));
  }
  function plural(n, word) { return `${n} ${word}${n === 1 ? "" : "s"}`; }
  function fmtElapsed(ms) {
    const t = Math.max(0, Math.floor(ms / 1000));
    const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
    const p = (n) => String(n).padStart(2, "0");
    return h ? `${h}:${p(m)}:${p(s)}` : `${m}:${p(s)}`;
  }

  // stick-to-bottom scrollers
  function makeScroller(scrollEl, colEl, jumpBtn) {
    const s = { stick: true };
    const near = () => scrollEl.scrollHeight - scrollEl.scrollTop - scrollEl.clientHeight < 80;
    scrollEl.addEventListener("scroll", () => {
      s.stick = near();
      if (jumpBtn) jumpBtn.hidden = s.stick;
    }, { passive: true });
    if (jumpBtn) jumpBtn.addEventListener("click", () => {
      s.stick = true; jumpBtn.hidden = true; scrollEl.scrollTop = scrollEl.scrollHeight;
    });
    s.add = (node) => {
      colEl.append(node);
      if (s.stick) scrollEl.scrollTop = scrollEl.scrollHeight;
      else if (jumpBtn) jumpBtn.hidden = false;
    };
    s.reset = () => { colEl.textContent = ""; };
    s.toBottom = () => { s.stick = true; if (jumpBtn) jumpBtn.hidden = true; scrollEl.scrollTop = scrollEl.scrollHeight; };
    return s;
  }
  const mainSc = makeScroller($("#log"), $("#logcol"), $("#jump"));
  const subSc = makeScroller($("#slog"), $("#slogcol"), $("#sjump"));

  // ---------- unread / title ----------
  function updateBadges() {
    let total = 0;
    for (const [id, rec] of cardEls) {
      const n = state.unread.get(id) ?? 0;
      total += n;
      rec.badge.hidden = n <= 0;
      rec.badge.textContent = n > 99 ? "99+" : String(n);
    }
    const lb = $("#livebar-badge");
    lb.hidden = total <= 0;
    lb.textContent = total > 99 ? "99+" : String(total);
    document.title = total > 0 ? `(${total}) Mission Control` : "Mission Control";
  }
  function bumpUnread(id, n) {
    if (!n || state.openSub === id) return;
    state.unread.set(id, (state.unread.get(id) ?? 0) + n);
    updateBadges();
  }

  // ---------- live work panel ----------
  function buildCard(id) {
    const root = document.createElement("button");
    root.type = "button";
    root.className = "card";
    root.dataset.win = id;
    root.innerHTML =
      '<span class="dot"></span>' +
      '<span class="card-name"></span>' +
      '<span class="badge card-badge" hidden></span>' +
      '<span class="card-time"></span>' +
      '<span class="card-sub"></span>' +
      '<span class="card-ticker"></span>';
    const rec = {
      root,
      dot: root.querySelector(".dot"),
      name: root.querySelector(".card-name"),
      time: root.querySelector(".card-time"),
      sub: root.querySelector(".card-sub"),
      ticker: root.querySelector(".card-ticker"),
      badge: root.querySelector(".card-badge"),
      tickerText: null,
    };
    root.addEventListener("click", () => toggleSub(id));
    return rec;
  }
  function tickerText(s) {
    const w = state.wins.get(s.id);
    const items = w?.items ?? [];
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      if (it.kind === "tool") return "\u203a " + it.name + "  " + (it.text || "");
      if (it.kind === "assistant") return it.text;
      if (it.kind === "report") return it.name + ": " + it.text;
      if (it.kind === "event" && it.name === "task") return it.text;
    }
    return s.lastExcerpt || s.label || "";
  }
  function fillStatus(el, s) {
    el.textContent = "";
    const st = document.createElement("span");
    st.className = "st " + (s?.status ?? "");
    st.textContent = s?.status ?? "\u2014";
    el.append(st);
    const tok = s?.usage?.totalTokens;
    if (Number.isFinite(tok) && tok > 0) el.append(document.createTextNode(" \u00b7 " + fmtTokens(tok) + " tok"));
    if (s?.model) el.append(document.createTextNode(" \u00b7 " + s.model));
  }
  function updateCard(rec, s) {
    rec.dot.className = "dot " + s.status;
    rec.name.textContent = s.id;
    if (s.status === "done") {
      rec.time.textContent = s.lastActivity ? relTime(s.lastActivity) : "";
    } else {
      const fs = state.firstSeen.get(s.id);
      rec.time.textContent = fs ? fmtElapsed(Date.now() - fs) : "";
    }
    fillStatus(rec.sub, s);
    const txt = tickerText(s);
    if (txt !== rec.tickerText) {
      rec.tickerText = txt;
      rec.ticker.textContent = txt;
      if (s.status === "running" && rec.ticker.animate) {
        rec.ticker.animate([{ opacity: .25 }, { opacity: 1 }], { duration: 280, easing: "ease-out" });
      }
    }
    rec.root.classList.toggle("active", state.openSub === s.id);
    rec.root.title = [s.id, s.label, s.model].filter(Boolean).join("\n");
  }
  function orderInto(el, list) {
    const sig = list.map((s) => s.id).join("|");
    if (el.dataset.sig === sig) return;
    el.dataset.sig = sig;
    for (const s of list) el.append(cardEls.get(s.id).root);
  }
  function updateLivebarStatus(active) {
    const running = active.filter((s) => s.status === "running").length;
    const blocked = active.filter((s) => s.status === "blocked").length;
    $("#livebar-text").textContent =
      blocked ? `${running} running \u00b7 ${blocked} blocked` : running ? `${running} running` : "no live work";
    $("#livebar-dot").className = "dot " + (blocked ? "blocked" : running ? "running" : "");
  }
  function syncPanel(subs) {
    for (const id of [...cardEls.keys()]) {
      if (!state.subs.has(id)) { cardEls.get(id).root.remove(); cardEls.delete(id); }
    }
    for (const s of subs) if (!cardEls.has(s.id)) cardEls.set(s.id, buildCard(s.id));
    for (const s of subs) updateCard(cardEls.get(s.id), s);
    const active = subs.filter((s) => s.status !== "done");
    const done = subs.filter((s) => s.status === "done");
    orderInto($("#cards"), active);
    orderInto($("#done-cards"), done);
    $("#panel-count").textContent = active.length ? `${active.length} live` : "idle";
    const toggle = $("#done-toggle");
    toggle.hidden = done.length === 0;
    toggle.textContent = state.doneShown ? `Hide finished (${done.length})` : `Show finished (${done.length})`;
    $("#done-cards").hidden = !state.doneShown;
    $("#panel-empty").hidden = subs.length > 0;
    updateLivebarStatus(active);
    updateBadges();
  }

  // ---------- usage (resource inventory) ----------
  function usageIsEmpty(s) {
    return s.toolCalls === 0 && s.subagents.length === 0 && s.skills.length === 0 && s.assistantMessages === 0;
  }
  function usageSummaryText(s) {
    if (!s || usageIsEmpty(s)) return "no activity yet";
    const parts = [];
    if (s.toolCalls > 0) parts.push(plural(s.toolCalls, "tool call"));
    if (s.subagents.length > 0) parts.push(plural(s.subagents.length, "subagent"));
    if (s.skills.length > 0) parts.push(plural(s.skills.length, "skill"));
    if (!parts.length) parts.push(plural(s.assistantMessages, "message"));
    return parts.join(" \u00b7 ");
  }
  /** Client-side fallback when server stats are absent (windowed slice only). */
  function usageFromItems(items) {
    const counts = new Map();
    const subagents = [];
    const skills = new Set();
    let assistantMessages = 0;
    for (const it of items) {
      if (it.kind === "tool") {
        counts.set(it.name, (counts.get(it.name) ?? 0) + 1);
        if (it.name === "subagent_spawn") {
          let a = null;
          try { a = JSON.parse(it.text); } catch { /* args preview may be truncated */ }
          subagents.push({
            id: null,
            label: (a && (typeof a.label === "string" ? a.label : typeof a.task === "string" ? a.task.split("\n", 1)[0] : null)) || null,
            session: a && typeof a.session === "string" ? a.session : null,
            model: a && typeof a.model === "string" ? a.model : null,
          });
        }
        if (it.name === "read" || it.name === "grep") {
          const m = /skills\/([A-Za-z0-9][A-Za-z0-9._-]*)\/SKILL\.md/i.exec(it.text || "") || /\.pi\/skills\/([A-Za-z0-9][A-Za-z0-9._-]*)\//i.exec(it.text || "");
          if (m) skills.add(m[1]);
        }
      } else if (it.kind === "assistant") {
        assistantMessages++;
      }
    }
    const tools = [...counts.entries()].map(([name, count]) => ({ name, count })).sort((a, b) => b.count - a.count || (a.name < b.name ? -1 : 1));
    return { tools, toolCalls: tools.reduce((a, t) => a + t.count, 0), subagents, skills: [...skills].sort(), assistantMessages, assistantTurns: assistantMessages, tokens: null, model: null, startedAt: null };
  }
  function statsForWin(id) {
    const w = win(id);
    return w.stats ?? usageFromItems(w.items);
  }
  function sectionEl(label) {
    const d = document.createElement("div");
    d.className = "u-sec";
    const l = document.createElement("div");
    l.className = "u-label";
    l.textContent = label;
    d.append(l);
    return d;
  }
  function tokensSection(t) {
    const sec = sectionEl("Tokens");
    const parts = [`total ${fmtTokens(t.total)}`, `in ${fmtTokens(t.input)}`, `out ${fmtTokens(t.output)}`, `cache read ${fmtTokens(t.cacheRead)}`, `cache write ${fmtTokens(t.cacheWrite)}`];
    if (t.reasoning > 0) parts.push(`reasoning ${fmtTokens(t.reasoning)}`);
    parts.push(`cost $${Number(t.cost ?? 0).toFixed(4)}`);
    const line = document.createElement("div");
    line.className = "u-line";
    line.textContent = parts.join(" \u00b7 ");
    sec.append(line);
    if (t.framesWithoutUsage > 0) {
      const note = document.createElement("div");
      note.className = "u-line";
      note.textContent = `${t.framesWithoutUsage} assistant frame${t.framesWithoutUsage === 1 ? "" : "s"} without usage excluded`;
      sec.append(note);
    }
    return sec;
  }
  function toolsSection(tools) {
    const sec = sectionEl("Tools");
    const max = tools[0]?.count || 1;
    for (const t of tools.slice(0, 12)) {
      const row = document.createElement("div");
      row.className = "u-row";
      const n = document.createElement("span"); n.className = "u-name"; n.textContent = t.name;
      const bar = document.createElement("span"); bar.className = "u-bar";
      const fill = document.createElement("i"); fill.style.width = `${Math.max(4, Math.round((t.count / max) * 100))}%`;
      bar.append(fill);
      const c = document.createElement("span"); c.className = "u-count"; c.textContent = String(t.count);
      row.append(n, bar, c);
      sec.append(row);
    }
    if (tools.length > 12) {
      const more = document.createElement("div"); more.className = "u-more"; more.textContent = `\u2026${tools.length - 12} more`;
      sec.append(more);
    }
    return sec;
  }
  function subagentsSection(subs) {
    const sec = sectionEl("Subagents");
    for (const c of subs) {
      const view = c.id ? state.subs.get(c.id) : null;
      const row = document.createElement("div");
      row.className = "u-sub-row";
      const dot = document.createElement("span"); dot.className = "dot " + (view ? view.status : "");
      const id = document.createElement("span"); id.className = "u-sub-id"; id.textContent = c.id ?? "child";
      const label = document.createElement("span"); label.className = "u-sub-label"; label.textContent = c.label ?? ""; label.title = c.label ?? "";
      const st = document.createElement("span"); st.className = "u-sub-status" + (view && view.status === "blocked" ? " blocked" : ""); st.textContent = view ? view.status : "unknown";
      row.append(dot, id, label, st);
      sec.append(row);
    }
    return sec;
  }
  function skillsSection(skills) {
    const sec = sectionEl("Skills");
    for (const s of skills) {
      const row = document.createElement("div"); row.className = "u-sub-row";
      const n = document.createElement("span"); n.className = "u-sub-id"; n.textContent = s;
      row.append(n);
      sec.append(row);
    }
    return sec;
  }
  function modelSection(s, modelFallback) {
    const sec = sectionEl("Model");
    const line = document.createElement("div"); line.className = "u-line";
    const model = s.model || modelFallback || null;
    line.textContent = [...(model ? [model] : []), plural(s.assistantMessages, "text message"), plural(s.assistantTurns, "turn")].join(" \u00b7 ");
    sec.append(line);
    return sec;
  }
  function renderUsage(body, stats, modelFallback) {
    body.textContent = "";
    if (!stats || usageIsEmpty(stats)) {
      const e = document.createElement("div"); e.className = "u-empty"; e.textContent = "no activity yet";
      body.append(e);
      return;
    }
    if (stats.tokens && (stats.tokens.framesWithUsage > 0 || stats.tokens.framesWithoutUsage > 0)) body.append(tokensSection(stats.tokens));
    if (stats.tools.length) body.append(toolsSection(stats.tools));
    if (stats.subagents.length) body.append(subagentsSection(stats.subagents));
    if (stats.skills.length) body.append(skillsSection(stats.skills));
    body.append(modelSection(stats, modelFallback));
  }
  function updateUsage(key) {
    const stats = statsForWin(key);
    const sig = JSON.stringify(stats);
    if (key === "main") {
      const body = $("#main-usage-body"), sum = $("#main-usage-sum");
      sum.textContent = usageSummaryText(stats);
      if (body.dataset.sig !== sig) {
        body.dataset.sig = sig;
        if (!body.hidden) renderUsage(body, stats, null);
      }
    } else if (state.openSub === key) {
      const body = $("#so-usage-body"), sum = $("#so-usage-sum");
      sum.textContent = usageSummaryText(stats);
      if (body.dataset.sig !== sig) {
        body.dataset.sig = sig;
        if (!body.hidden) renderUsage(body, stats, state.subs.get(key)?.model ?? null);
      }
    }
  }
  function applyUsageOpen(key) {
    const open = state.usageOpen.get(key) ?? key !== "main";
    const head = key === "main" ? $("#main-usage-head") : $("#so-usage-head");
    const body = key === "main" ? $("#main-usage-body") : $("#so-usage-body");
    head.setAttribute("aria-expanded", String(open));
    body.hidden = !open;
    if (open && !body.children.length) {
      body.dataset.sig = "";
      updateUsage(key);
    }
  }
  function toggleUsage(key) {
    state.usageOpen.set(key, !(state.usageOpen.get(key) ?? key !== "main"));
    applyUsageOpen(key);
  }

  // ---------- transcript rendering ----------
  function renderMainItem(item) {
    const d = document.createElement("div");
    d.className = "msg " + item.kind + (item.pending ? " pending" : "") + (item.failed ? " failed" : "");
    if (item.kind === "user") {
      const b = document.createElement("div");
      b.className = "bubble";
      b.textContent = item.text;
      d.append(b);
      if (item.failed) {
        const m = document.createElement("div");
        m.className = "meta";
        m.textContent = "not delivered";
        d.append(m);
      }
    } else {
      const m = document.createElement("div");
      m.className = "meta";
      if (item.ts) m.dataset.ts = String(item.ts);
      m.textContent = "coordinator" + (item.ts ? " \u00b7 " + relTime(item.ts) : "");
      d.append(m);
      const t = document.createElement("div");
      t.className = "atext";
      t.textContent = item.text;
      d.append(t);
    }
    return d;
  }
  function renderSubLine(line) {
    if (line.kind === "assistant") {
      const d = document.createElement("div");
      d.className = "msg assistant";
      const t = document.createElement("div");
      t.className = "atext";
      t.textContent = line.text;
      d.append(t);
      return d;
    }
    const d = document.createElement("div");
    if (line.kind === "report") {
      d.className = "evt report";
      d.dataset.status = line.name;
      const st = document.createElement("span");
      st.className = "rstatus";
      st.textContent = line.name;
      d.append(st, document.createTextNode(line.text));
    } else if (line.kind === "tool") {
      d.className = "evt tool";
      const n = document.createElement("span");
      n.className = "tname";
      n.textContent = "\u203a " + line.name;
      const a = document.createElement("span");
      a.className = "targs";
      a.textContent = line.text || "";
      d.append(n, a);
    } else if (line.kind === "event" && line.name === "task") {
      d.className = "evt task";
      const st = document.createElement("span");
      st.className = "rstatus";
      st.textContent = "task";
      d.append(st, document.createTextNode(line.text));
    } else {
      d.className = "evt settled";
      d.textContent = "\u2014 settled \u2014";
    }
    return d;
  }
  function refreshMainNode(it) {
    const w = win("main");
    const idx = w.items.indexOf(it);
    if (idx < 0) return;
    const el = $("#logcol").children[idx];
    if (el) {
      $("#logcol").replaceChild(renderMainItem(it), el);
      if (mainSc.stick) $("#log").scrollTop = $("#log").scrollHeight;
    }
  }
  function sweepPending() {
    const w = win("main");
    for (const it of w.items) {
      if (it.pending && it.ts && Date.now() - it.ts > 60000) {
        it.pending = false;
        it.failed = true;
        refreshMainNode(it);
      }
    }
  }
  function refreshAges() {
    for (const m of document.querySelectorAll("#logcol .msg.assistant .meta[data-ts]")) {
      const ts = Number(m.dataset.ts);
      if (Number.isFinite(ts) && ts > 0) m.textContent = "coordinator \u00b7 " + relTime(ts);
    }
  }

  function rebuildMain() {
    const w = win("main");
    mainSc.reset();
    if (!w.items.length) {
      const e = document.createElement("div");
      e.className = "empty";
      e.textContent = "No messages yet. Say hello \u2014 the coordinator replies here.";
      $("#logcol").append(e);
    } else {
      for (const it of w.items) $("#logcol").append(renderMainItem(it));
    }
    mainSc.toBottom();
  }
  function placeResult() {
    $("#slogcol").querySelector(".result-block")?.remove();
    const id = state.openSub;
    if (!id) return;
    const w = win(id);
    if (!w.resultText) return;
    const d = document.createElement("div");
    d.className = "result-block";
    const l = document.createElement("div");
    l.className = "rb-label";
    l.textContent = "Result";
    const pre = document.createElement("pre");
    pre.textContent = w.resultText;
    d.append(l, pre);
    $("#slogcol").append(d);
  }
  function rebuildSub() {
    const id = state.openSub;
    if (!id) return;
    const w = win(id);
    subSc.reset();
    if (!w.items.length) {
      const e = document.createElement("div");
      e.className = "empty";
      e.textContent = w.done ? "Finished. Result below." : "No events yet.";
      $("#slogcol").append(e);
    } else {
      for (const ln of w.items) $("#slogcol").append(renderSubLine(ln));
    }
    placeResult();
    subSc.toBottom();
  }

  // ---------- slide-over ----------
  function updateSoHeader(s) {
    if (!s) return;
    $("#so-dot").className = "dot " + s.status;
    fillStatus($("#so-sub"), s);
    $("#so-time").textContent = s.status === "done" ? (s.lastActivity ? relTime(s.lastActivity) : "") : "";
    $("#so-label").textContent = s.label ?? "";
  }
  function syncBackdrop() {
    $("#backdrop").classList.toggle("on", !!(state.openSub && window.innerWidth < 1080));
  }
  function openSub(id) {
    state.openSub = id;
    state.unread.delete(id);
    updateBadges();
    updateSoHeader(state.subs.get(id));
    $("#so-id").textContent = id;
    const s = state.subs.get(id);
    $("#sinput").placeholder = s && s.status === "done"
      ? "This subagent finished \u2014 replies go via the coordinator"
      : `Reply to ${id}`;
    rebuildSub();
    $("#so-usage-body").dataset.sig = "";
    applyUsageOpen(id);
    updateUsage(id);
    $("#slideover").classList.add("open");
    syncBackdrop();
    for (const [cid, rec] of cardEls) rec.root.classList.toggle("active", cid === id);
    pollWin(id);
    if (window.innerWidth >= 1080) $("#sinput").focus({ preventScroll: true });
  }
  function closeSub() {
    state.openSub = null;
    $("#slideover").classList.remove("open");
    syncBackdrop();
    for (const rec of cardEls.values()) rec.root.classList.remove("active");
  }
  function toggleSub(id) { state.openSub === id ? closeSub() : openSub(id); }

  // ---------- polling ----------
  async function pollState() {
    let data;
    try {
      const r = await api("/state");
      data = r.body;
      if (!r.ok || !data) throw new Error(r.code);
      if (state.bridgeDown) {
        state.bridgeDown = false;
        $("#bridge-dot").className = "dot running";
        $("#bridge-status").textContent = "bridge \u00b7 127.0.0.1";
      }
    } catch {
      if (!state.bridgeDown) {
        state.bridgeDown = true;
        $("#bridge-dot").className = "dot blocked";
        $("#bridge-status").textContent = "bridge offline";
      }
      return;
    }
    $("#project").textContent = data.project;
    const subs = data.subagents ?? [];
    state.subs = new Map(subs.map((s) => [s.id, s]));
    const now = data.now ?? Date.now();
    for (const s of subs) if (!state.firstSeen.has(s.id)) state.firstSeen.set(s.id, now);
    // fallback unread signal for subagents whose log polling is not landing
    for (const s of subs) {
      if (s.status === "done") continue;
      if (now - (logOkAt.get(s.id) ?? 0) < 10000) continue;
      const prev = state.prevActivity.get(s.id) ?? 0;
      if (s.lastActivity > prev) {
        if (state.prevActivity.has(s.id)) bumpUnread(s.id, 1);
        state.prevActivity.set(s.id, s.lastActivity);
      }
    }
    syncPanel(subs);
    const mtime = data.main?.sessionMtime;
    $("#win-meta").textContent = mtime ? `last activity ${relTime(mtime)}` : "";
    if (state.openSub) updateSoHeader(state.subs.get(state.openSub));
    sweepPending();
    refreshAges();
  }

  async function pollWin(id) {
    const w = win(id);
    // /main-log takes ?after; /sub-log already carries ?id= so the cursor joins with &
    const after = w.cursor === null ? "" : `${id === "main" ? "?" : "&"}after=${w.cursor}`;
    const r = id === "main"
      ? await api(`/main-log${after}`)
      : await api(`/sub-log?id=${encodeURIComponent(id)}${after}`);
    if (!r.ok || !r.body) return;
    if (id !== "main") logOkAt.set(id, Date.now());
    const b = r.body;
    w.cursor = b.cursor;

    if (id === "main") {
      if (b.reset) {
        w.items = (b.items ?? []).slice();
        rebuildMain();
      } else {
        const fresh = [];
        for (const item of b.items ?? []) {
          const idx = w.items.findIndex((x) => x.pending && x.kind === "user" && x.text === item.text);
          if (idx >= 0) {
            w.items.splice(idx, 1);
            $("#logcol").children[idx]?.remove();
            w.items.splice(idx, 0, item);
            const ref = $("#logcol").children[idx];
            const node = renderMainItem(item);
            if (ref) $("#logcol").insertBefore(node, ref); else $("#logcol").append(node);
          } else {
            w.items.push(item);
            fresh.push(item);
          }
        }
        if (w.items.length) $("#logcol").querySelector(".empty")?.remove();
        if (fresh.length) {
          for (const it of fresh) $("#logcol").append(renderMainItem(it));
          if (mainSc.stick) $("#log").scrollTop = $("#log").scrollHeight;
        }
      }
      if (w.items.length > 600) { w.items = w.items.slice(-600); rebuildMain(); }
      w.stats = b.stats ?? (w.stats ?? usageFromItems(w.items));
      updateUsage("main");
      return;
    }

    // subagent window
    w.done = !!b.done;
    if (b.result != null) w.resultText = b.result;
    if (b.reset) {
      w.items = (b.lines ?? []).slice();
      if (state.openSub === id) rebuildSub();
    } else {
      const fresh = [];
      for (const ln of b.lines ?? []) { w.items.push(ln); fresh.push(ln); }
      if (fresh.length) {
        bumpUnread(id, fresh.length);
        if (state.openSub === id) {
          $("#slogcol").querySelector(".empty")?.remove();
          for (const ln of fresh) subSc.add(renderSubLine(ln));
          placeResult();
        }
      }
    }
    if (w.items.length > 2000) {
      w.items = w.items.slice(-2000);
      if (state.openSub === id) rebuildSub();
    }
    w.stats = b.stats ?? (w.stats ?? usageFromItems(w.items));
    if (state.openSub === id) updateUsage(id);
  }

  async function pollLogs() {
    const targets = new Set(["main"]);
    for (const s of state.subs.values()) if (s.status !== "done") targets.add(s.id);
    if (state.openSub) targets.add(state.openSub);
    await Promise.allSettled([...targets].map((id) => pollWin(id)));
  }

  // ---------- elapsed tick ----------
  setInterval(() => {
    if (document.hidden) return;
    const now = Date.now();
    for (const s of state.subs.values()) {
      if (s.status === "done") continue;
      const rec = cardEls.get(s.id);
      const fs = state.firstSeen.get(s.id);
      if (rec && fs) rec.time.textContent = fmtElapsed(now - fs);
    }
    if (state.openSub) {
      const s = state.subs.get(state.openSub);
      const fs = state.firstSeen.get(state.openSub);
      if (s && s.status !== "done" && fs) $("#so-time").textContent = fmtElapsed(now - fs);
    }
  }, 1000);

  // ---------- composers ----------
  function autosize(el) {
    el.style.height = "auto";
    el.style.height = Math.min(el.scrollHeight, 160) + "px";
  }
  function wireComposer(inputEl, btn, onSubmit) {
    const sync = () => { btn.disabled = inputEl.value.trim().length === 0; };
    inputEl.addEventListener("input", () => { sync(); autosize(inputEl); });
    inputEl.addEventListener("keydown", (e) => {
      // isComposing/229: the Enter that confirms an IME candidate must not submit,
      // or compositionend re-fills the box right after the handler clears it.
      if (e.isComposing || e.keyCode === 229) return;
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); inputEl.form.requestSubmit(); }
    });
    sync();
    return sync;
  }

  const input = $("#input"), sendBtn = $("#send");
  let sendingMain = false;
  const syncMain = wireComposer(input, sendBtn, null);
  $("#composer").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (sendingMain) return;
    const text = input.value.trim();
    if (!text) return;
    sendingMain = true;
    sendBtn.disabled = true;
    input.value = "";
    autosize(input);
    const w = win("main");
    $("#logcol").querySelector(".empty")?.remove();
    const optimistic = { kind: "user", text, ts: Date.now(), pending: true, failed: false };
    w.items.push(optimistic);
    mainSc.add(renderMainItem(optimistic));
    const r = await api("/message", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ target: "main", text }),
    });
    if (!r.ok) {
      optimistic.pending = false;
      optimistic.failed = true;
      refreshMainNode(optimistic);
    }
    sendingMain = false;
    syncMain();
  });

  const sinput = $("#sinput"), ssend = $("#ssend");
  let sendingSub = false;
  const syncSub = wireComposer(sinput, ssend, null);
  $("#scomposer").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (sendingSub || !state.openSub) return;
    const text = sinput.value.trim();
    if (!text) return;
    sendingSub = true;
    ssend.disabled = true;
    sinput.value = "";
    autosize(sinput);
    const r = await api("/message", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ target: "subagent:" + state.openSub, text }),
    });
    const note = document.createElement("div");
    note.className = "sysline";
    note.textContent = r.ok
      ? "Forwarded to the coordinator for delivery."
      : `Not delivered: ${r.body?.error ?? r.code}`;
    subSc.add(note);
    sendingSub = false;
    syncSub();
  });

  // ---------- chrome controls ----------
  $("#so-close").addEventListener("click", closeSub);
  $("#backdrop").addEventListener("click", closeSub);
  $("#main-usage-head").addEventListener("click", () => toggleUsage("main"));
  $("#so-usage-head").addEventListener("click", () => { if (state.openSub) toggleUsage(state.openSub); });
  $("#done-toggle").addEventListener("click", () => {
    state.doneShown = !state.doneShown;
    syncPanel([...state.subs.values()]);
  });
  $("#livebar").addEventListener("click", () => {
    state.panelOpen = !state.panelOpen;
    $("#panel").classList.toggle("open", state.panelOpen);
    $("#livebar").classList.toggle("open", state.panelOpen);
    $("#livebar").setAttribute("aria-expanded", String(state.panelOpen));
  });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (state.openSub) closeSub();
    else if (state.panelOpen) $("#livebar").click();
  });
  window.addEventListener("resize", syncBackdrop);

  // ---------- boot ----------
  pollState().then(pollLogs);
  setInterval(pollState, 3000);
  setInterval(pollLogs, 2000);
})();
</script>
</body>
</html>
